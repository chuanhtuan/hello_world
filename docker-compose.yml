# Local development only - spins up a MySQL 8 instance matching the
# backend's default .env.example settings. Not used in production
# (production uses RDS - see infra/).
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hello_world
      MYSQL_USER: hello_world
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme_root
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
